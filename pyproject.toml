[build-system]
requires = ["uv_build==0.11.3"]
build-backend = "uv_build"

[project]
name = "skills-sdk"
version = "0.1.0"
description = "Portable lifecycle contracts and tooling for Agent Skills packages."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema[format-nongpl]>=4.26.0,<5",
  "pydantic>=2.11.0,<3",
  "pyyaml>=6.0.3,<7",
]

[project.scripts]
skills-sdk = "skills_sdk.cli.main:main"

[dependency-groups]
dev = [
  "mypy==1.18.1",
  "pytest==9.1.1",
  "ruff==0.15.22",
  "types-jsonschema==4.26.0.20260518",
  "types-pyyaml==6.0.12.20250822",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "skills_sdk"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["scripts/check_repository_standards.py", "tests/test_repository_standards.py"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
